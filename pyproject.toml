[project]
name = "demand-forecasting"
version = "0.1.0"
description = "Store x SKU daily demand forecasting and replenishment prototype for a convenience-store chain (local Spark, migrates to Databricks serverless)."
readme = "README.md"
authors = [
    { name = "Carlos Morillo", email = "2914407+morillo@users.noreply.github.com" }
]
license = "MIT"
# Mirrors Databricks serverless environment version 6 (Python 3.12.3). See docs/decisions/0001.
requires-python = ">=3.12,<3.13"
# Runtime dependencies are what the wheel needs on Databricks. Versions are pinned to the
# packages preinstalled in the serverless environment 6 "ML" base environment so local runs
# behave like serverless runs. PySpark is not listed: Databricks provides it (see the
# `local` group below for the local copy).
# Exception: MLflow has a security floor instead of the serverless version (3.12.0 is
# affected by GHSA-7gwp-5pfp-969j, GHSA-2cm6-r77w-6g96, GHSA-gqvg-gmmx-x4hm; fixed in 3.15.0).
dependencies = [
    "lightgbm==4.6.0",
    "mlflow-skinny>=3.15.0",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "scipy==1.16.3",
]

[project.scripts]
dfc = "demand_forecasting.cli:main"

[dependency-groups]
# Local Spark engine. Spark 4.2.0 is the Spark line of Databricks Runtime 19, which backs
# serverless environment 6. Delta Lake 4.4.x supports Spark 4.2.
local = [
    "delta-spark==4.4.1",
    "pyspark[connect]==4.2.0",
]
# Full MLflow (tracking UI + SQLite backend) for local experiment tracking.
tracking = [
    "mlflow>=3.15.0",
]
# Optional results viewer.
app = [
    "deltalake>=1.6.6",
    "streamlit>=1.66.1",
]
dev = [
    "pandas-stubs~=2.3.3",
    "pre-commit>=4.3.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
default-groups = ["local", "tracking", "app", "dev"]
# Security floors for transitive dependencies (pulled in by MLflow and Streamlit); they bound
# the lock file without making these direct dependencies. See docs/decisions/0001.
constraint-dependencies = [
    "cryptography>=50.0.0",  # GHSA-m2h6-j472-rp4c, GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww, GHSA-537c-gmf6-5ccf
    "starlette>=1.3.1",      # GHSA-86qp-5c8j-p5mr, GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c, GHSA-82w8-qh3p-5jfq, GHSA-jp82-jpqv-5vv3
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", # pipeline functions legitimately take several parameters
    "PLR2004", # magic numbers are fine in a simulation / modelling codebase
    "E501",    # line length is the formatter's job; long DDL strings and lookup tables stay readable
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: end-to-end pipeline run on the tiny dataset (slower)"]
