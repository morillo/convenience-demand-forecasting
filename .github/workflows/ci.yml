name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Cache Delta Lake jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/demand-forecasting/ivy
          key: ivy-${{ hashFiles('src/demand_forecasting/spark.py') }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff (lint + format)
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Pyright (same checks as VS Code Pylance)
        run: uv run pyright
      - name: Tests, including the end-to-end pipeline and the results app
        run: uv run pytest
      - name: Documented quickstart (tiny preset, fresh folder)
        run: |
          uv run dfc run-all --preset tiny --data-dir "$RUNNER_TEMP/quickstart"
      - name: Wheel builds (what the Databricks bundle deploys)
        run: uv build --wheel
      - name: Audit every locked dependency for known vulnerabilities
        # PYSEC-2026-113 (pyarrow < 23.0.1) is an accepted risk; see docs/decisions/0001.
        run: |
          uv export --all-groups --no-hashes --no-emit-project -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --ignore-vuln PYSEC-2026-113

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # pyarrow 21.0.0 is pinned to match Databricks serverless; this advisory (same as
          # PYSEC-2026-113 in the audit step) is an accepted risk, see docs/decisions/0001.
          allow-ghsas: GHSA-rgxp-2hwp-jwgg
